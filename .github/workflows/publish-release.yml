name: Publish AzuraCast Suite release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish tagged release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag matches plugin version
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*\* Version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' azuracast-native-suite.php | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Run release checks
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/front.js
          node --test tests/front-js.test.js
      - name: Build clean installable ZIP
        run: bash scripts/build-release.sh "${{ runner.temp }}/release-package"
      - name: Create GitHub Release and attach plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP_PATH="$(find "${{ runner.temp }}/release-package" -maxdepth 1 -type f -name 'azuracast-native-suite-*.zip' -print -quit)"
          test -n "$ZIP_PATH"
          gh release create "$GITHUB_REF_NAME" "$ZIP_PATH" --verify-tag --title "AzuraCast Suite ${GITHUB_REF_NAME#v}" --generate-notes
