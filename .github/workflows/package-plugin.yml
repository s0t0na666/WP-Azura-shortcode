name: Package installable plugin

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and validate WordPress ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run frontend syntax and regression checks
        run: |
          node --check assets/js/front.js
          node --check assets/js/blocks.js
          node --test tests/*.test.js
      - name: Build clean release ZIP and lint included PHP
        run: bash scripts/build-release.sh "${{ runner.temp }}/release-package"
      - name: Upload installable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: azuracast-native-suite-1.3.4
          path: ${{ runner.temp }}/release-package/azuracast-native-suite-1.3.4.zip
          if-no-files-found: error
          retention-days: 30
